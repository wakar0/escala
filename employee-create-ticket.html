<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Ticket - Escala</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh;" class="employee-view">
    <div class="header">
        <div class="header-title">
            <h2>Escala - Create New Ticket</h2>
        </div>
        <div class="user-info">
            <span id="userGreeting">Welcome back!</span>
            <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
        </div>
    </div>
    
    <div class="container">
        <div class="nav-menu">
            <a href="employee-dashboard.html">Dashboard</a>
            <a href="employee-tickets.html">My Tickets</a>
        </div>
        
        <div class="content-box">
            <h3>Create New Ticket</h3>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <div id="successMessage" class="success-message" style="display: none;"></div>
            <form id="createTicketForm">
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" maxlength="200" required>
                    <span class="error-text" id="subjectError"></span>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="6" maxlength="1000" required></textarea>
                    <span class="error-text" id="descriptionError"></span>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="hardware">Hardware Issue</option>
                        <option value="software">Software Issue</option>
                        <option value="network">Network Issue</option>
                        <option value="access">Access/Permission Issue</option>
                        <option value="other">Other</option>
                    </select>
                    <span class="error-text" id="categoryError"></span>
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" required>
                        <option value="">Select Priority</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                    <span class="error-text" id="priorityError"></span>
                </div>
                <div class="actions">
                    <button type="submit" id="submitBtn" class="btn-primary">Submit Ticket</button>
                    <a href="employee-dashboard.html" class="btn-secondary" id="cancelBtn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="create-ticket.js"></script>
</body>
</html>
