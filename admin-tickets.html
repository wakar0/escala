<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tickets - Escala</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
</head>
<body style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh;" class="admin-view">
    <div class="header">
        <div class="header-title">
            <h2>Escala - All Tickets</h2>
        </div>
        <div class="user-info">
            <span>Admin User</span>
            <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
        </div>
    </div>
    
    <div class="container">
        <div class="nav-menu">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="admin-sla-breaches.html">SLA Breaches <span id="breachBadge" class="badge-alert" style="display: none;">0</span></a>
            <a href="admin-users.html">Manage Users</a>
            <a href="admin-reports.html">Reports</a>
        </div>
        
        <div class="filters">
            <input type="text" id="searchTickets" placeholder="Search tickets..." style="padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #e0e0e0; width: 250px;">
            <select id="statusFilter">
                <option>All Status</option>
                <option>Open</option>
                <option>In Progress</option>
            </select>
            <select id="priorityFilter">
                <option>All Priority</option>
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
                <option>Critical</option>
            </select>
            <select id="slaFilter">
                <option>All SLA Status</option>
                <option>Within SLA</option>
                <option>Breached</option>
            </select>
        </div>
        
        <div class="content-box">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>All Tickets</h3>
                <div id="bulkActions" style="display: none; gap: 10px;">
                    <select id="bulkStatus" style="padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: #e0e0e0;">
                        <option value="">Change Status</option>
                        <option value="in-progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                    </select>
                    <button class="btn-primary" onclick="applyBulkAction()" style="padding: 8px 16px;">Apply</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>Ticket ID</th>
                        <th>Employee</th>
                        <th>Subject</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Assigned To</th>
                        <th>SLA Status</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="9" style="text-align: center; color: #888; padding: 40px;">No tickets found</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="admin-tickets.js"></script>
</body>
</html>
