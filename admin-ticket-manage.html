<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Ticket - Escala</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
</head>
<body style="background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh;" class="admin-view">
    <div class="header">
        <div class="header-title">
            <h2>Escala - Manage Ticket</h2>
        </div>
        <div class="user-info">
            <span>Admin User</span>
            <button class="logout-btn" onclick="window.location.href='index.html'">Logout</button>
        </div>
    </div>
    
    <div class="container">
        <div class="nav-menu">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="admin-tickets.html">All Tickets</a>
        </div>
        
        <div class="ticket-detail">
            <h3>Ticket Information</h3>
            <div class="detail-row">
                <label>Ticket ID:</label>
                <span>#001</span>
            </div>
            <div class="detail-row">
                <label>Employee:</label>
                <span>John Doe</span>
            </div>
            <div class="detail-row">
                <label>Subject:</label>
                <span>Laptop not starting</span>
            </div>
            <div class="detail-row">
                <label>Description:</label>
                <span>My laptop is not starting after the latest update.</span>
            </div>
            <div class="detail-row">
                <label>Created Date:</label>
                <span>2024-01-15 10:30 AM</span>
            </div>
            <div class="detail-row">
                <label>SLA Status:</label>
                <span class="sla-ok">Within SLA (4 hours remaining)</span>
            </div>
        </div>
        
        <div class="content-box">
            <h3>Admin Actions</h3>
            <form>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="open">Open</option>
                        <option value="in-progress">In Progress</option>
                        <option value="resolved">Resolved</option>
                        <option value="closed">Closed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Assign To</label>
                    <select name="assign">
                        <option>Unassigned</option>
                        <option>Admin 1</option>
                        <option>Admin 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select name="priority">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Add Comment</label>
                    <textarea placeholder="Add update or comment..."></textarea>
                </div>
                <div class="actions">
                    <button type="submit" class="btn-primary">Save Changes</button>
                    <button type="button" class="btn-primary" style="background: #dc3545;">Escalate Ticket</button>
                    <a href="admin-tickets.html" class="btn-secondary">Back</a>
                </div>
            </form>
        </div>
    </div>
    <script src="admin-ticket-manage.js"></script>
</body>
</html>
