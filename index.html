<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Escala</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
    <div class="container" style="max-width: 700px; padding-top: 60px;">
        <div style="text-align: center; margin-bottom: 50px;">
            <h1 style="font-size: 56px; font-weight: 900; color: #f1f5f9; margin-bottom: 16px; letter-spacing: -1px; text-shadow: 0 4px 20px rgba(0,0,0,0.5);">
                ESCALA
            </h1>
            <p style="font-size: 20px; color: #94a3b8; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;">
                IT Support & SLA Management System
            </p>
        </div>
        
        <div class="content-box" style="border: 4px solid #667eea; box-shadow: 0 0 60px rgba(102, 126, 234, 0.4); position: relative; overflow: hidden;">
            <div style="position: absolute; top: 0; left: 0; right: 0; height: 8px; background: linear-gradient(90deg, #667eea, #764ba2, #667eea); animation: shimmer 3s infinite;"></div>
            
            <div style="padding-top: 20px;">
                <h3 style="text-align: center; font-size: 28px; margin-bottom: 40px; color: #667eea; text-transform: uppercase; letter-spacing: 2px;">
                    SYSTEM LOGIN
                </h3>
                
                <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success" style="display: none;"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" style="font-size: 15px; letter-spacing: 2px;">EMAIL ADDRESS</label>
                        <input type="email" id="email" placeholder="your.email@company.com" required style="padding: 18px 20px; font-size: 17px; border: 4px solid #334155; font-weight: 600;">
                        <span class="form-error" id="emailError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" style="font-size: 15px; letter-spacing: 2px;">PASSWORD</label>
                        <input type="password" id="password" placeholder="Enter secure password" required style="padding: 18px 20px; font-size: 17px; border: 4px solid #334155; font-weight: 600;">
                        <span class="form-error" id="passwordError"></span>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" style="font-size: 15px; letter-spacing: 2px; margin-bottom: 20px;">SELECT ACCESS LEVEL</label>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <input type="radio" name="role" id="roleEmployee" value="employee" required style="display: none;">
                            <label for="roleEmployee" class="role-mega-card">
                                <div style="margin-bottom: 16px;">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                        <circle cx="12" cy="7" r="4"/>
                                    </svg>
                                </div>
                                <div style="font-size: 20px; font-weight: 900; color: #f1f5f9; margin-bottom: 8px; letter-spacing: 1px;">EMPLOYEE</div>
                                <div style="font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Support Access</div>
                            </label>
                            
                            <input type="radio" name="role" id="roleAdmin" value="admin" required style="display: none;">
                            <label for="roleAdmin" class="role-mega-card">
                                <div style="margin-bottom: 16px;">
                                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                        <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                                    </svg>
                                </div>
                                <div style="font-size: 20px; font-weight: 900; color: #f1f5f9; margin-bottom: 8px; letter-spacing: 1px;">ADMIN</div>
                                <div style="font-size: 13px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">Full Control</div>
                            </label>
                        </div>
                        <span class="form-error" id="roleError"></span>
                    </div>
                    
                    <button type="submit" id="loginBtn" style="width: 100%; padding: 22px; font-size: 20px; font-weight: 900; letter-spacing: 3px; margin-top: 30px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 12px; color: white; cursor: pointer; text-transform: uppercase; box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5); transition: all 0.3s;">
                        ACCESS SYSTEM
                    </button>
                </form>
                
                <div style="margin-top: 40px; text-align: center; padding-top: 30px; border-top: 3px solid #334155;">
                    <p style="font-size: 14px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 2px;">
                        SECURED BY 256-BIT ENCRYPTION
                    </p>
                </div>
            </div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px;">
            <div style="background: #1e293b; padding: 24px; border-radius: 12px; border: 3px solid #334155; text-align: center;">
                <div style="font-size: 32px; font-weight: 900; color: #667eea;">24/7</div>
                <div style="font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 8px;">Support</div>
            </div>
            <div style="background: #1e293b; padding: 24px; border-radius: 12px; border: 3px solid #334155; text-align: center;">
                <div style="font-size: 32px; font-weight: 900; color: #667eea;">99.9%</div>
                <div style="font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 8px;">Uptime</div>
            </div>
            <div style="background: #1e293b; padding: 24px; border-radius: 12px; border: 3px solid #334155; text-align: center;">
                <div style="font-size: 32px; font-weight: 900; color: #667eea;">< 2H</div>
                <div style="font-size: 12px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-top: 8px;">Response</div>
            </div>
        </div>
    </div>
    
    <script src="supabase-config.js"></script>
    <script src="login.js"></script>
</body>
</html>
